apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orders-api
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: ["shop"]
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: catalog-service
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: ["shop"]
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
