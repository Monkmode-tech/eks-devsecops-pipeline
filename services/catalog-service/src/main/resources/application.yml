server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false

spring:
  application:
    name: catalog-service
  lifecycle:
    timeout-per-shutdown-phase: 10s
  main:
    banner-mode: "off"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: catalog-service
